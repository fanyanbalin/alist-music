<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿铭原创音乐播放器</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="toast-container"></div>
    
    <div class="container">
        <!-- 添加顶部提示区域 -->
        <div class="welcome-tip">
            <div class="tip-content">
                <i class="ri-music-2-line"></i>
                <span>欢迎使用音乐播放器！请输入网易云歌单ID，例如：18205229314</span>
                <button class="tip-close"><i class="ri-close-line"></i></button>
            </div>
        </div>

        <div class="player-container">
            <!-- 左侧播放器主体 -->
            <div class="player-main">
                <!-- 搜索区域 -->
                <div class="search-section">
                    <div class="search-box">
                        <i class="ri-search-line"></i>
                        <input type="text" id="playlist-input" placeholder="输入网易云歌单ID...">
                        <button id="playlist-btn" type="button"><i class="ri-play-list-2-line"></i>歌单</button>
                        <button id="parse-btn">解析</button>
                    </div>
                </div>

                <!-- 播放器核心区域 -->
                <div class="player-content">
                    <div class="album-section">
                        <div class="album-cover">
                            <img id="cover" src="https://api.qijieya.cn/meting/?server=netease&type=pic&id=109951165994484307" alt="album cover">
                        </div>
                        <div class="song-info">
                            <h2 id="song-name">歌曲名称</h2>
                            <p id="artist-name">歌手名称</p>
                        </div>
                    </div>

                    <div class="lyrics-section">
                        <div class="lyrics-container">
                            <div class="lyrics-wrapper" id="lyrics">
                                <p class="empty-lyrics">暂无歌词</p>
                            </div>
                        </div>
                    </div>

                    <div class="control-section">
                        <div class="progress-bar">
                            <span id="current-time">00:00</span>
                            <div class="progress">
                                <div class="progress-current"></div>
                            </div>
                            <span id="duration">00:00</span>
                        </div>
                        
                        <div class="controls">
                            <button id="prev-btn"><i class="ri-skip-back-fill"></i></button>
                            <button id="play-btn"><i class="ri-play-fill"></i></button>
                            <button id="next-btn"><i class="ri-skip-forward-fill"></i></button>
                            <div class="mode-wrap" id="mode-wrap">
                                <button type="button" id="mode-btn" class="mode-btn" title="播放模式"><i class="ri-list-unordered"></i></button>
                                <div class="mode-menu" id="mode-menu">
                                    <button type="button" class="mode-option" data-mode="sequential"><i class="ri-list-unordered"></i>顺序播放</button>
                                    <button type="button" class="mode-option" data-mode="shuffle"><i class="ri-shuffle-line"></i>随机播放</button>
                                    <button type="button" class="mode-option" data-mode="loop"><i class="ri-repeat-line"></i>循环播放</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧播放列表 -->
            <div class="playlist-container">
                <div class="playlist-header">
                    <h3>播放列表</h3>
                    <span class="song-count">0 首歌曲</span>
                </div>
                <div class="playlist">
                    <ul id="song-list"></ul>
                </div>
            </div>
        </div>
    </div>
    <!-- 歌单浏览弹窗 -->
    <div class="modal-overlay" id="playlist-modal" role="dialog" aria-modal="true" aria-label="歌单浏览">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="ri-disc-line"></i>歌单</h3>
                <button type="button" class="modal-close" id="modal-close" title="关闭">
                    <i class="ri-close-line"></i>
                </button>
            </div>
            <div class="modal-tabs" id="modal-tabs">
                <button type="button" class="modal-tab active" data-mode="normal">普通歌单</button>
                <button type="button" class="modal-tab" data-mode="highquality">精品歌单</button>
            </div>
            <div class="modal-cats" id="modal-cats"></div>
            <div class="modal-playlists" id="modal-playlists"></div>
            <div class="modal-footer" id="modal-footer">
                <button type="button" class="load-more-btn" id="load-more-btn">加载更多</button>
            </div>
        </div>
    </div>
    <audio id="audio" src=""></audio>
    <!-- 播放配置（音质等级，见 config.js） -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
